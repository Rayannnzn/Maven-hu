      - paragraph [ref=f3e140]:
        - text: Restaurants, offices, and retail stores cannot afford long outages. We repair lighting, outlets, and equipment power supply issues, and we install new connections for kitchen equipment, refrigeration, and workspace lighting. Because our technicians also service HVAC and commercial equipment, we can tell whether a failing unit has an electrical cause or a mechanical one. You can read how that works in our guide to
        - link "24 hour AC repair in Rockville" [ref=f3e141] [cursor=pointer]:
          - /url: /blog/24-hour-ac-repair-rockville
