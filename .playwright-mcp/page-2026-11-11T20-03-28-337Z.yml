      - heading "Electrical Repair and Installation in Rockville, MD" [level=1] [ref=f3e72]
      - paragraph [ref=f3e73]:
        - text: When an outlet stops working, a breaker keeps tripping, or you need a new fixture or fan installed, you want a licensed electrician who does the job safely and explains it clearly. Maven DMV provides electrical repair and installation for homes and businesses in Rockville, MD and across Montgomery County, Maryland. This page covers what we repair, what we install, and how we work. For the full list of what we offer, visit our
        - link "main electrical services page" [ref=f3e74] [cursor=pointer]:
          - /url: /electrical
        - text: .
      - generic [ref=f3e75]:
        - link "Schedule Service" [ref=f3e76] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f3e77] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f3e79]:
      - generic [ref=f3e80]:
        - generic [ref=f3e81]: Overview
        - heading "What Is Included in Electrical Repair and Installation?" [level=2] [ref=f3e82]
      - paragraph [ref=f3e84]: Electrical repair means finding and fixing a fault in existing wiring, devices, or equipment, such as a dead outlet, a failed switch, or a breaker that will not stay on. Electrical installation means adding new wiring, devices, or fixtures, such as a ceiling fan, new lighting, or an upgraded panel. Both types of work must meet electrical code, and both should end with testing so you know the circuit is safe to use.
    - generic [ref=f3e87]:
      - generic [ref=f3e88]:
        - generic [ref=f3e89]: Service
        - heading "Electrical Repair Services" [level=2] [ref=f3e90]
      - paragraph [ref=f3e91]: "Most electrical problems start small. A warm outlet or a light that flickers can point to a loose connection, a worn device, or an overloaded circuit. We diagnose and repair:"
      - list [ref=f3e93]:
        - listitem [ref=f3e94]:
          - generic [ref=f3e95]: check_circle
          - text: Outlets and switches that are dead, loose, cracked, or hot to the touch
        - listitem [ref=f3e96]:
          - generic [ref=f3e97]: check_circle
          - text: Circuit breakers that trip or will not reset
        - listitem [ref=f3e98]:
          - generic [ref=f3e99]: check_circle
          - text: Flickering, dimming, or buzzing lights
        - listitem [ref=f3e100]:
          - generic [ref=f3e101]: check_circle
          - text: Ceiling lights that have come loose or fallen
        - listitem [ref=f3e102]:
          - generic [ref=f3e103]: check_circle
          - text: Partial power loss in one room or one side of a building
        - listitem [ref=f3e104]:
          - generic [ref=f3e105]: check_circle
          - text: Damaged wiring and loose connections
        - listitem [ref=f3e106]:
          - generic [ref=f3e107]: check_circle
          - text: Power supply faults on commercial and HVAC equipment
      - paragraph [ref=f3e108]: We trace the cause first and do not replace parts by guesswork. That saves you money and prevents the same problem from coming back. If you have a project that is not listed here, call us and describe it. We will tell you honestly whether we can handle it and what it will involve.
      - generic [ref=f3e109]:
        - link "Schedule a Repair" [ref=f3e110] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f3e111] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f3e114]:
      - generic [ref=f3e115]:
        - generic [ref=f3e116]: Service
        - heading "Repair or Replace? How We Decide" [level=2] [ref=f3e117]
      - paragraph [ref=f3e118]: Not every electrical problem needs a big project. A single failed switch is a simple replacement. Repeated breaker trips across several rooms may mean overloaded circuits or an aging panel, which calls for a deeper look. In older homes, brittle insulation or outdated devices can make repeated spot repairs a poor use of your money. We will tell you when a small repair is enough and when replacement is the safer and more economical choice.
      - generic [ref=f3e119]:
        - link "Get an Honest Assessment" [ref=f3e120] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f3e121] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f3e124]:
      - generic [ref=f3e125]:
        - generic [ref=f3e126]: Service
        - 'heading "Installation Done Safely: Permits, Code, and Testing" [level=2] [ref=f3e127]'
      - paragraph [ref=f3e128]:
        - text: Many electrical installations in Maryland require permits and inspections, and local rules can vary by project and jurisdiction. We explain what applies to your job before work starts. Every installation is tested before we leave, and we show you how the new fixture or device works. For general homeowner guidance, the
        - link "Electrical Safety Foundation International" [ref=f3e129] [cursor=pointer]:
          - /url: https://www.esfi.org/
        - text: and the
        - link "National Fire Protection Association" [ref=f3e130] [cursor=pointer]:
          - /url: https://www.nfpa.org/
        - text: offer trusted safety resources. Working on live circuits without training is dangerous, so we recommend leaving panel, wiring, and fixture work to licensed professionals.
      - generic [ref=f3e131]:
        - link "Plan an Installation" [ref=f3e132] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f3e133] [cursor=pointer]:
          - /url: tel:+12402554794
