        - heading "Why GFCI Outlets Matter" [level=2] [ref=f1e151]
      - paragraph [ref=f1e152]: A ground fault circuit interrupter, or GFCI, watches the flow of electricity and cuts power in a fraction of a second if it senses leakage, such as current traveling through water or a person. GFCI protection is commonly required in wet areas like kitchens, bathrooms, garages, basements, and outdoors. If your older home has regular outlets in these areas, adding GFCI protection is one of the most useful and affordable safety upgrades you can make. Test your GFCI outlets monthly using the built in test and reset buttons.
      - generic [ref=f1e153]:
        - link "Add GFCI Protection" [ref=f1e154] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f1e155] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f1e158]:
      - generic [ref=f1e159]:
        - generic [ref=f1e160]: Service
        - heading "Replacing Two Prong Outlets" [level=2] [ref=f1e161]
      - paragraph [ref=f1e162]:
        - text: Many older homes still have two prong outlets, which have no ground connection. Simply swapping in a three prong outlet without a ground wire can give a false sense of safety. Depending on your wiring, the safe options may include running a ground wire, using a GFCI outlet labeled for use without an equipment ground, or rewiring the circuit. We inspect the wiring first and explain which option fits. If your home has widespread older wiring, see our page on
        - link "electrical wiring and rewiring" [ref=f1e163] [cursor=pointer]:
          - /url: /electrical/wiring-rewiring-rockville
        - text: .
      - generic [ref=f1e164]:
        - link "Upgrade Two Prong Outlets" [ref=f1e165] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f1e166] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f1e169]:
      - generic [ref=f1e170]:
        - generic [ref=f1e171]: Service
        - heading "Why Professional Replacement Matters" [level=2] [ref=f1e172]
      - paragraph [ref=f1e173]:
        - text: Replacing an outlet can look simple, but the risks are real. Old wiring may be brittle, aluminum, or unmarked. A wrong connection can leave the outlet looking normal while creating a shock or fire hazard. Back stabbed connections, loose terminals, and wrong wire sizes are common causes of overheating. A licensed electrician checks the whole circuit, uses the right device for the location, and tests the result. For independent safety guidance, visit the
        - link "Electrical Safety Foundation International" [ref=f1e174] [cursor=pointer]:
          - /url: https://www.esfi.org/
        - text: or the
        - link "National Fire Protection Association" [ref=f1e175] [cursor=pointer]:
          - /url: https://www.nfpa.org/
        - text: .
      - generic [ref=f1e176]:
        - link "Schedule a Licensed Electrician" [ref=f1e177] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f1e178] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f1e181]:
      - generic [ref=f1e182]:
        - generic [ref=f1e183]: Service
        - heading "Outlet Replacement for Businesses" [level=2] [ref=f1e184]
      - paragraph [ref=f1e185]:
        - text: Restaurants, offices, and retail stores rely on outlets that handle constant use. We replace worn outlets, add dedicated outlets for equipment, and install GFCI protection in kitchens and wet areas. Because our team also services HVAC and commercial equipment, we can tell when a power problem comes from the outlet and when it comes from the equipment. You can explore related work on our
        - link "electrical services page" [ref=f1e186] [cursor=pointer]:
          - /url: /electrical
        - text: .
