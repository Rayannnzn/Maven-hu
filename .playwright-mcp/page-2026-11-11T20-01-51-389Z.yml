        - heading "How to Prevent Outlet Problems" [level=2] [ref=f1e195]
      - paragraph [ref=f1e196]:
        - text: A few habits reduce wear and risk. Avoid plugging several high power devices, such as space heaters, into one outlet or power strip. Do not run cords under rugs, and replace damaged cords right away. Use outlet covers or tamper resistant outlets if small children are in the home. Schedule an
        - link "electrical inspection" [ref=f1e197] [cursor=pointer]:
          - /url: /electrical/inspections-rockville
        - text: if your home is more than 30 years old or if outlets have never been checked. Catching worn outlets early costs far less than repairing heat damage later.
