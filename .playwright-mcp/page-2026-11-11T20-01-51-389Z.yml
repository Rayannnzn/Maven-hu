      - heading "Outlet Replacement in Rockville, MD" [level=1] [ref=f1e46]
      - paragraph [ref=f1e47]: An outlet that is cracked, loose, warm, or dead is more than an inconvenience. Worn outlets can arc, overheat, and damage plugs and devices. Maven DMV replaces and upgrades outlets for homes and businesses in Rockville, MD and across Montgomery County, Maryland. Our licensed electricians find out why the outlet failed, replace it correctly, and test the circuit before we leave.
      - generic [ref=f1e48]:
        - link "Schedule Service" [ref=f1e49] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f1e50] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f1e52]:
      - generic [ref=f1e53]:
        - generic [ref=f1e54]: Overview
        - heading "Quick Answer" [level=2] [ref=f1e55]
      - paragraph [ref=f1e57]: Replace an outlet when it is cracked, loose, discolored, warm, sparking, or no longer holds a plug firmly. A licensed electrician should do the work, because the wiring behind the outlet can be damaged or overloaded, and replacing only the outlet may not fix the real problem.
