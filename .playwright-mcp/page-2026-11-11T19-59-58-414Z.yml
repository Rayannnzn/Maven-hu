    - generic [ref=e71]:
      - heading "Electrical Wiring and Rewiring in Rockville, MD" [level=1] [ref=e72]
      - paragraph [ref=e73]: The wiring inside your walls carries every bit of power your home or business uses. When it is damaged, outdated, or overloaded, it can cause tripping breakers, dead outlets, and in serious cases a fire. Maven DMV provides new wiring, partial rewiring, and whole building rewiring for homes and businesses in Rockville, MD and across Montgomery County, Maryland. Our licensed electricians inspect first, explain what they find, and recommend only the work your property needs.
      - generic [ref=e74]:
        - link "Schedule Service" [ref=e75] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=e76] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=e78]:
      - generic [ref=e79]:
        - generic [ref=e80]: Overview
        - heading "Quick Answer" [level=2] [ref=e81]
      - paragraph [ref=e83]: Rewiring means replacing old or unsafe electrical wiring with new wiring that meets current code. You may need it if your home has knob and tube or aluminum branch wiring, frequent breaker trips, two prong outlets, burning smells, or wiring that has been damaged by pests, water, or age.
    - generic [ref=e86]:
      - generic [ref=e87]:
        - generic [ref=e88]: Service
        - heading "Signs Your Wiring May Need Attention" [level=2] [ref=e89]
      - paragraph [ref=e90]: Wiring problems often show up as small annoyances before they become serious. Use this table to match what you notice with what it may mean.
