      - paragraph [ref=e206]: We often recommend a phased approach, such as the kitchen and panel first, then bedrooms and living areas. That lets you spread out the work while keeping your highest risks under control. Rewiring can involve opening walls or ceilings. We protect your space, keep the work area as clean as we can, and explain what patching or finishing will remain for you or another trade.
