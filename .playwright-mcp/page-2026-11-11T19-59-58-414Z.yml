        - heading "Safety Standards and Trusted Resources" [level=2] [ref=e215]
      - paragraph [ref=e216]:
        - text: Electrical work must follow the code adopted in your area, and many projects require permits and inspections. We explain what applies before work begins. For independent safety information, the
        - link "Electrical Safety Foundation International" [ref=e217] [cursor=pointer]:
          - /url: https://www.esfi.org/
        - text: and the
        - link "National Fire Protection Association" [ref=e218] [cursor=pointer]:
          - /url: https://www.nfpa.org/
        - text: offer helpful consumer guidance. Some insurance companies also ask about older wiring types, so ask your insurer if you are unsure about your policy.
      - generic [ref=e219]:
