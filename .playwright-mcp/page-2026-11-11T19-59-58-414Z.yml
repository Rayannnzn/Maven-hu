        - heading "Older Wiring Types and Their Concerns" [level=2] [ref=e136]
      - paragraph [ref=e137]: Wiring materials and methods have changed over the decades. Many older homes in the Rockville area still have some original wiring, and not all of it meets modern needs.
      - table [ref=e139]:
        - rowgroup [ref=e140]:
          - row [ref=e141]:
            - columnheader "Wiring Type" [ref=e142]
            - columnheader "Typical Era" [ref=e143]
            - columnheader "Main Concern" [ref=e144]
            - columnheader "Common Solution" [ref=e145]
        - rowgroup [ref=e146]:
          - row [ref=e147]:
            - cell "Knob and tube" [ref=e148]
            - cell "Before the 1950s" [ref=e149]
            - cell "Cloth covered wires that become brittle, with no ground wire, and often buried in insulation" [ref=e150]
            - cell "Replace with modern cable" [ref=e151]
          - row [ref=e152]:
            - cell "Cloth or rubber covered cable" [ref=e153]
            - cell "Early to mid 1900s" [ref=e154]
            - cell "Insulation cracks and crumbles with age" [ref=e155]
            - cell "Replace affected runs" [ref=e156]
          - row [ref=e157]:
            - cell "Aluminum branch wiring" [ref=e158]
            - cell "Mid 1960s to mid 1970s" [ref=e159]
            - cell "Connections can loosen and overheat over time" [ref=e160]
            - cell "Approved repair methods or replacement" [ref=e161]
          - row [ref=e162]:
            - cell "Ungrounded two wire cable" [ref=e163]
            - cell "Mid 1900s" [ref=e164]
            - cell "No equipment ground, so surge and shock protection is limited" [ref=e165]
            - cell "Add grounding or rewire" [ref=e166]
          - row [ref=e167]:
            - cell "Overloaded older circuits" [ref=e168]
            - cell "Any era" [ref=e169]
