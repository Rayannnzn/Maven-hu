        - heading "Planning Wiring Before a Remodel" [level=2] [ref=e227]
      - paragraph [ref=e228]: Remodels are the best time to update wiring, because the walls are already open. If you are finishing a basement, renovating a kitchen, or adding a room, tell us early. We can plan circuits for appliances, lighting, and future needs, so you avoid opening finished walls again later. Good planning also helps you stay within what your panel can safely support, and it keeps the project schedule predictable for everyone involved.
