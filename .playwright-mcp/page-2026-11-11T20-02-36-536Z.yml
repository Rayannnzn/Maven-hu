        - heading "Sump Pump Installation Options" [level=2] [ref=f2e133]
      - paragraph [ref=f2e134]: A new installation starts with the right pump for your basement, your water table, and your budget. Here is how the two main types compare.
      - table [ref=f2e136]:
        - rowgroup [ref=f2e137]:
          - row [ref=f2e138]:
            - columnheader "Feature" [ref=f2e139]
            - columnheader "Pedestal Pump" [ref=f2e140]
            - columnheader "Submersible Pump" [ref=f2e141]
        - rowgroup [ref=f2e142]:
          - row [ref=f2e143]:
            - cell "Where it sits" [ref=f2e144]
            - cell "Motor above the pit, intake in the pit" [ref=f2e145]
            - cell "Fully inside the pit, underwater" [ref=f2e146]
          - row [ref=f2e147]:
