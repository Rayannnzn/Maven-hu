    - generic [ref=f2e207]:
      - generic [ref=f2e208]:
        - generic [ref=f2e209]: Service
        - heading "Why Sump Pumps Fail When You Need Them Most" [level=2] [ref=f2e210]
      - paragraph [ref=f2e211]: Most failures happen during heavy rain, because that is when the pump works hardest. A pump that sat idle for months can have a stuck float or a seized motor. Power outages stop a pump that has no backup. Debris, silt, and small stones can clog the intake, and a frozen or blocked discharge line forces water back into the pit. Regular testing and a yearly inspection catch most of these problems before a storm does.
      - generic [ref=f2e212]:
        - link "Schedule a Yearly Inspection" [ref=f2e213] [cursor=pointer]:
          - /url: /contact
