      - list [ref=f2e222]:
        - listitem [ref=f2e223]:
          - generic [ref=f2e224]: check_circle
          - text: Water is rising in the pit and the pump is silent
        - listitem [ref=f2e225]:
          - generic [ref=f2e226]: check_circle
          - text: You smell mold or see standing water near the pit
        - listitem [ref=f2e227]:
          - generic [ref=f2e228]: check_circle
          - text: The pump is running constantly during dry weather
        - listitem [ref=f2e229]:
          - generic [ref=f2e230]: check_circle
          - text: You hear grinding, rattling, or a burning smell from the motor
        - listitem [ref=f2e231]:
          - generic [ref=f2e232]: check_circle
          - text: The breaker or GFCI outlet for the pump keeps tripping
      - paragraph [ref=f2e233]: If water is near electrical outlets or panels, stay away and do not touch the water. Turn off power only if you can reach the breaker safely and dry, and call 911 if anyone is in danger. For other urgent sump pump problems, our emergency line is open 24 hours a day, 7 days a week.
