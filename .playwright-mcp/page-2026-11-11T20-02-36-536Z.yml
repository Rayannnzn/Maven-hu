        - heading "Battery Backup and Water Alarms" [level=2] [ref=f2e172]
      - paragraph [ref=f2e173]: Heavy storms often cause power outages, which is exactly when your pump is needed most. A battery backup pump takes over when the main pump or the power fails. A water level alarm alerts you before water reaches the floor. We recommend both for finished basements and for homes where flooding would be costly. Backup systems need periodic battery checks, and we explain how to maintain yours.
