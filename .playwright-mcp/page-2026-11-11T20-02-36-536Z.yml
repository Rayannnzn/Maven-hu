    - generic [ref=f2e72]:
      - heading "Sump Pump Repair and Installation in Rockville, MD" [level=1] [ref=f2e73]
      - paragraph [ref=f2e74]: A sump pump is the device that keeps groundwater out of your basement or crawl space. When it fails during a storm, water can damage floors, walls, stored belongings, and electrical equipment within hours. Maven DMV repairs, replaces, and installs sump pumps for homes and businesses in Rockville, MD and across Montgomery County, Maryland. Call us at the first sign of trouble, and we will help you decide whether a repair or a new pump makes more sense.
      - generic [ref=f2e75]:
        - link "Schedule Service" [ref=f2e76] [cursor=pointer]:
          - /url: /contact
        - link "Call 240-255-4794" [ref=f2e77] [cursor=pointer]:
          - /url: tel:+12402554794
    - generic [ref=f2e79]:
      - generic [ref=f2e80]:
        - generic [ref=f2e81]: Overview
        - heading "Quick Answer" [level=2] [ref=f2e82]
      - paragraph [ref=f2e84]: A sump pump collects water in a pit below your floor and pumps it out and away from your foundation. Most pumps last about 7 to 10 years. If yours is noisy, runs nonstop, will not turn on, or is more than 10 years old, have it checked before the next heavy rain.
    - generic [ref=f2e87]:
      - generic [ref=f2e88]:
        - generic [ref=f2e89]: Service
        - heading "Sump Pump Problems We Repair" [level=2] [ref=f2e90]
      - paragraph [ref=f2e91]: The table below shows common symptoms, what usually causes them, and how we fix them.
      - table [ref=f2e93]:
        - rowgroup [ref=f2e94]:
          - row [ref=f2e95]:
            - columnheader "Symptom" [ref=f2e96]
            - columnheader "Likely Cause" [ref=f2e97]
            - columnheader "What We Do" [ref=f2e98]
        - rowgroup [ref=f2e99]:
          - row [ref=f2e100]:
            - cell "Pump will not turn on" [ref=f2e101]
            - cell "Tripped breaker or GFCI, failed switch, dead motor, or unplugged cord" [ref=f2e102]
            - cell "Restore power, test the circuit, replace the switch or pump" [ref=f2e103]
          - row [ref=f2e104]:
            - cell "Pump runs nonstop" [ref=f2e105]
            - cell "Stuck float switch, failed check valve, or a very high water table" [ref=f2e106]
            - cell "Free or replace the float, replace the check valve, check pit size" [ref=f2e107]
          - row [ref=f2e108]:
            - cell "Pump runs but moves little water" [ref=f2e109]
            - cell "Clogged intake, worn impeller, or a blocked discharge line" [ref=f2e110]
            - cell "Clean the pump, clear the line, replace worn parts" [ref=f2e111]
          - row [ref=f2e112]:
            - cell "Loud grinding or rattling" [ref=f2e113]
            - cell "Worn bearings, debris in the pump, or a loose fitting" [ref=f2e114]
            - cell "Remove debris, replace the pump if the motor is failing" [ref=f2e115]
          - row [ref=f2e116]:
            - cell "Pump cycles on and off rapidly" [ref=f2e117]
            - cell "Pit too small, bad check valve, or water flowing back into the pit" [ref=f2e118]
            - cell "Replace the check valve, adjust the float, or resize the pit" [ref=f2e119]
          - row [ref=f2e120]:
            - cell "Water around the pit or basement floor" [ref=f2e121]
            - cell "Pump failure, frozen or blocked discharge, or overwhelmed capacity" [ref=f2e122]
            - cell "Emergency repair, discharge fix, or a higher capacity pump" [ref=f2e123]
      - paragraph [ref=f2e124]: We test before we replace anything. Many sump pump problems come from a small part, such as a float switch or check valve, and not from the pump itself.
      - generic [ref=f2e125]:
        - link "Schedule a Sump Pump Repair" [ref=f2e126] [cursor=pointer]:
