          - row [ref=f2e155]:
            - cell "Best for" [ref=f2e156]
            - cell "Narrow pits and easy access" [ref=f2e157]
            - cell "Most homes and finished basements" [ref=f2e158]
          - row [ref=f2e159]:
            - cell "Service access" [ref=f2e160]
            - cell "Easy to see and reach" [ref=f2e161]
            - cell "Must be lifted out of the pit" [ref=f2e162]
      - paragraph [ref=f2e163]: We also install check valves, discharge lines, and sealed pit covers, which reduce moisture, odors, and noise. If you do not have a pit yet, we can discuss creating one.
